<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 10 - JS</title>
</head>
<style>
    main {
        display: flex;
    }
    
    .trai {
        width: 75%;
        /* height: 500px; */
        /* background-color: blue; */
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .phai {
        width: 25%;
        /* height: 500px; */
        /* background-color: red; */
        /* text-align: center; */
        border: 1px solid gray;
        border-radius: 20px;
    }
    
    .video {
        width: 90%;
        height: 450px;
        background-color: black;
        border-radius: 20px;
    }
    
    .bolero {
        width: 95%;
        height: 80px;
        margin: 10px auto;
        /* background-color: antiquewhite; */
        display: flex;
        align-items: center;
    }
    
    img {
        width: 30%;
        margin-right: 10px;
        height: 90%;
    }
    
    p {
        width: 75%;
    }
    
    h1 {
        text-align: center;
    }
    
    .bolero:hover {
        background-color: gray;
    }
</style>

<body>
    <main>
        <div class="trai">
            <div class="video">
                <iframe class="video" src="https://www.youtube.com/embed/fDCo3EIzKA4?list=RDOzOHyowIzgg" title="TÌNH CHA - NGỌC SƠN | Official Music Video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                <h1></h1>
            </div>
        </div>
        <div class="phai">
            <h1>Danh sách phát</h1>
            <div class="danh-sach">
                <div onclick="chonBai(1)" class="bolero">
                    <img class="anh-bai" src="../anh/anh 10.png" alt=" ">
                    <p> Tình cha</p>
                </div>
                <div onclick="chonBai(2)" class="bolero">
                    <img class="anh-bai" src="../anh/anh 2.png" alt=" ">
                    <p> Bài ca kỷ niệm</p>
                </div>
                <div onclick="chonBai(3)" class="bolero">
                    <img class="anh-bai" src="../anh/anh 5.png" alt=" ">
                    <p> Người phu kéo mo cau</p>
                </div>
                <div onclick="chonBai(4)" class="bolero">
                    <img class="anh-bai" src="../anh/anh 6.png" alt=" ">
                    <p> Mưa đêm tỉnh nhỏ</p>
                </div>
                <div onclick="chonBai(5)" class="bolero">
                    <img class="anh-bai" src="../anh/anh 7.png" alt=" ">
                    <p> Phố vắng em rồi</p>
                </div>
            </div>
        </div>
    </main>
    <script>
        var danhSachBaiHat = [{
            id: 1,
            ten: "Gánh mẹ",
            duongDanAnh: "",
            duongDanYoutube: "https://www.youtube.com/embed/cXpP9v3IQk8"
        }, {
            id: 2,
            ten: "em ơi lâu đài tình ái",
            duongDanAnh: "../anh/anh 2.png",
            duongDanYoutube: "https://www.youtube.com/embed/OzOHyowIzgg"
        }, {
            id: 3,
            ten: "đắp mộ",
            duongDanAnh: "../anh/anh 3.png",
            duongDanYoutube: "https://www.youtube.com/embed/emH2LgE-4SE"
        }, {
            id: 4,
            ten: "BOMMAN",
            duongDanAnh: "../anh/anh 4.png",
            duongDanYoutube: "https://www.youtube.com/embed/CYLY7ZTg0Cs"
        }, {
            id: 5,
            ten: "hoa phượng đỏ",
            duongDanAnh: "../anh/anh 5.png",
            duongDanYoutube: "https://www.youtube.com/embed/K5p09EGkQuU"
        }];

        function chonbai(id) {

            // Tìm bài hát theo ID
            var baiDuocChon = danhSachBaiHat.find(function(bai) {
                return bai.id == id;
            });

            // Nếu tìm thấy bài hát
            if (baiDuocChon) {

                // Lấy khung video
                var video = document.getElementById("video-banner");

                // Thay đổi video
                video.src = baiDuocChon.duongDanYoutube + "?autoplay=1";

            }
        }
    </script>
</body>

</html>
