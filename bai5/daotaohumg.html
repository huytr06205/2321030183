<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Cổng thông tin đào tạo HUMG</title>


    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        /* Menu trên */
        
        .menu {
            background: #2fa4e7;
        }
        
        .danh-sach {
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            gap: 15px;
            /* các đối tượng bọc ở trong khối tự động cách nhau khoảng cách bằng giá trị truyền vào */
        }
        
        .muc {
            padding: 15px;
        }
        
        .lk-muc {
            color: white;
            text-decoration: none;
        }
        /* Nội dung */
        
        main {
            display: flex;
        }
        
        .cot-trai {
            width: 20%;
            min-height: 1000px;
            border-right: 1px solid #2fa4e7;
        }
        
        .dang-nhap {
            background: #fff;
            width: 90%;
            height: 300px;
            margin: 10px auto;
        }
        
        input {
            width: 100%;
            padding: 5px 0;
            border-radius: 5px;
        }
        
        .quen {
            color: blue;
            text-decoration: none;
        }
        
        button {
            width: 100%;
            padding: 5px 0;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #dedede;
            color: #fff;
        }
        
        .DN {
            background: #2fa4e7;
        }
        
        .DN-365 {
            background: #2fa4e7;
        }
        
        .cot-phai {
            width: 82%;
            padding: 15px;
        }
        
        .thong-tin {
            background: #fff;
            height: 90vh;
            margin: 20px auto;
            border: 1px solid #2fa4e7;
            border-radius: 10px;
            padding: 5px;
        }
        
        .tin-tren {
            width: 95%;
            margin: auto;
            border-bottom: 1px solid #2fa4e7;
            justify-content: space-between;
            padding: 10px;
            display: flex;
        }
        
        h3 {}
        
        .xem-tiep {
            color: #2fa4e7;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <nav class="menu">
        <ul class="danh-sach">
            <li class="muc"><a class="lk-muc" href="#">Thực tập, Đồ án</a></li>
            <li class="muc"><a class="lk-muc" href="#">Thủ tục Một Cửa</a></li>
            <li class="muc"><a class="lk-muc" href="#">Một Cửa online</a></li>
            <li class="muc"><a class="lk-muc" href="#">E-mail HUMG</a></li>
        </ul>
    </nav>

    <!--==main==-->

    <main>
        <div class="cot-trai">
            <div class="dang-nhap">
                <form action="">
                    <label>Đăng nhập </label>

                    <input type="text">

                    <label>Mật Khẩu</label>
                    <input type="password">

                    <i><a class="quen" href="#">Quên mật khẩu?</a></i><br>


                    <button class="DN">Đăng nhập </button><br>
                    <button class="DN-365"> Đăng nhập với microsoft 365</button>

                </form>
            </div>


        </div>

        <div class="cot-phai">
            <div class="thong-tin">
                <div class="tin-tren">
                    <h3 class="tieu-de">Tin tức</h3>
                    <p>
                        <a class="xem-tiep" href="#">Xem tiếp

                        </a>
                    </p>

                </div>

                <!--danh sách tin-->

                <div class="ds-tin">


                </div>



            </div>

        </div>






    </main>


</body>

</html>
